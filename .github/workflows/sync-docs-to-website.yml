name: Sync docs to modmixer.com

# When docs change on main, bump the modmixer-src submodule pointer in
# modmixer.com so the new docs ship on its next deploy.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: sync-docs-to-website
  cancel-in-progress: false

jobs:
  bump-submodule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout modmixer.com
        uses: actions/checkout@v4
        with:
          repository: lebek/modmixer.com
          token: ${{ secrets.MODMIXER_COM_PUSH_TOKEN }}
          submodules: true
          fetch-depth: 1

      - name: Bump modmixer-src to latest main
        run: |
          set -euo pipefail
          git submodule update --init --remote --merge modmixer-src
          if git diff --quiet -- modmixer-src; then
            echo "Submodule already up to date; nothing to push."
            exit 0
          fi
          git config user.name "modmixer-docs-bot"
          git config user.email "docs-bot@modmixer.com"
          git add modmixer-src
          git commit -m "Update docs from modmixer@${GITHUB_SHA::7}"
          git push origin HEAD:main
