name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Required for Azure OIDC federated login on the Windows signing job.
permissions:
  id-token: write
  contents: read

jobs:
  publish:
    # Scopes the OIDC token's `sub` claim to repo:lebek/modmixer:environment:release,
    # which is what the Azure federated identity credential matches against.
    # Applies to all matrix variants — only Windows actually uses OIDC, but the
    # shared environment is harmless for the others and lets us hang protection
    # rules (e.g. required reviewer) off it later.
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: macos-14
            arch: arm64
          - os: ubuntu-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fakeroot dpkg

      - name: Set up .NET SDK
        # Required to build the vendored ilspycmd binary for this OS/arch.
        # ILSpy v10.x's ILSpyCmd csproj targets net8.0. Bumping needs to
        # track the upstream tag pinned in scripts/fetch-ilspycmd.mjs.
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        env:
          # @vscode/ripgrep's postinstall hits api.github.com to find the
          # prebuilt binary; the anonymous 60/hr limit gets exhausted by
          # parallel matrix jobs. Token raises it to 5000/hr.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Build vendored ilspycmd for this host
        # Drops a self-contained binary at
        # resources/ilspycmd/<platform>-<arch>/ilspycmd[.exe]. Forge ships
        # whatever's in resources/ilspycmd into the installer's
        # extraResource, so each runner contributes its own platform.
        run: npm run fetch:ilspycmd

      # Smoke test the packaged app BEFORE signing/publishing. Catches the
      # class of bug where an external in vite.main.config.ts isn't shipped
      # via extraResource (the v0.4.4 web-tree-sitter crash). Runs unsigned
      # — the failure modes we care about are independent of code signing,
      # and skipping signing here saves wear on the Trusted Signing quota.
      # Windows-only for now: the same forge.config.ts ships extraResource
      # to all platforms, so a Windows smoke test catches the same class of
      # bug across the matrix. The downstream Publish step re-runs the
      # package step (electron-forge has no skip-package mode) — wasted
      # work, but cheaper than shipping a broken release.
      - name: Smoke-test packaged app
        if: matrix.os == 'windows-latest'
        shell: pwsh
        timeout-minutes: 5
        run: |
          npx electron-forge package -- --arch=${{ matrix.arch }}
          $exe = Get-ChildItem -Path out -Recurse -Filter modmixer.exe |
                 Where-Object { $_.FullName -like "*Modmixer-win32-${{ matrix.arch }}*" } |
                 Select-Object -First 1
          if (-not $exe) { throw "modmixer.exe not found under out/" }
          Write-Output "Launching: $($exe.FullName) --smoke-test"
          $proc = Start-Process -FilePath $exe.FullName -ArgumentList '--smoke-test' -PassThru
          if (-not $proc.WaitForExit(60000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            throw "Smoke test did not exit within 60s — likely hung in startup"
          }
          if ($proc.ExitCode -ne 0) {
            throw "Smoke test failed with exit code $($proc.ExitCode)"
          }
          Write-Output "Smoke test passed"

      # Windows-only: Azure Trusted Signing setup. Logs in via GitHub OIDC
      # (no long-lived secret), pulls the signing dlib from NuGet, and
      # writes the cert profile metadata file. forge.config.ts picks both
      # paths up via env vars and feeds them to signtool.
      - name: Azure login (OIDC)
        if: matrix.os == 'windows-latest'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Trusted Signing dlib
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          nuget install Microsoft.Trusted.Signing.Client `
            -Version 1.0.60 `
            -OutputDirectory "$env:RUNNER_TEMP\tsclient" `
            -ExcludeVersion `
            -NonInteractive
          $metadata = @{
            Endpoint               = 'https://eus.codesigning.azure.net/'
            CodeSigningAccountName = 'modmixer-signing'
            CertificateProfileName = 'modmixer-release'
          } | ConvertTo-Json
          Set-Content -Path "$env:RUNNER_TEMP\trusted-signing-metadata.json" -Value $metadata -Encoding utf8
          "WINDOWS_SIGN_DLIB=$env:RUNNER_TEMP\tsclient\Microsoft.Trusted.Signing.Client\bin\x64\Azure.CodeSigning.Dlib.dll" >> $env:GITHUB_ENV
          "WINDOWS_SIGN_METADATA=$env:RUNNER_TEMP\trusted-signing-metadata.json" >> $env:GITHUB_ENV

      - name: Publish
        env:
          # PAT with write access to the public modmixer-releases repo.
          GITHUB_TOKEN: ${{ secrets.RELEASES_GH_TOKEN }}
          # Baked into the bundle at build time via Vite's `define`. Empty in
          # forks / dev builds where these secrets aren't configured, in which
          # case both SDKs no-op cleanly.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
        run: npm run publish -- --arch=${{ matrix.arch }}
