<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Classic preview</title>
<link rel="stylesheet" href="_shared.css" />
<style>
  .canvas {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 64px 80px;
  }
  .bg {
    position: absolute;
    inset: 0;
    z-index: 0;
  }
  .bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.0) 0%, rgba(0,0,0,0.35) 100%);
  }
  .stack {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    gap: 28px;
  }
  .sprite-wrap {
    flex: 0 0 auto;
    height: 360px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sprite-wrap img {
    height: 100%;
    width: auto;
    max-width: 100%;
    object-fit: contain;
    filter: drop-shadow(0 18px 30px rgba(0,0,0,0.45));
  }
  .title-box {
    flex: 1 1 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .title {
    width: 100%;
    text-align: center;
  }
  .subtitle {
    flex: 0 0 auto;
    color: rgba(255,255,255,0.85);
    font-size: 26px;
  }
</style>
</head>
<body>
<div class="canvas" id="canvas">
  <div class="bg" id="bg"></div>
  <div class="stack">
    <div class="sprite-wrap"><img id="sprite" alt="" /></div>
    <div class="title-box" id="titleBox"><div class="title" id="title"></div></div>
    <div class="subtitle" id="subtitle" style="display:none"></div>
  </div>
</div>
<script src="_shared.js"></script>
<script>
window.__renderPreview = function (p) {
  document.getElementById('bg').style.background = p.background || '#1c2030';
  const sprite = document.getElementById('sprite');
  if (p.spriteUrl) {
    sprite.src = p.spriteUrl;
    sprite.style.display = '';
  } else {
    sprite.style.display = 'none';
  }
  const title = document.getElementById('title');
  title.textContent = p.title || '';
  title.style.color = p.titleColor || '#fff';
  title.classList.toggle('font-rimworld', p.titleFont === 'rimworld');
  title.classList.remove('fx-shadow', 'fx-outline', 'fx-glow');
  if (p.titleEffect && p.titleEffect !== 'none') {
    title.classList.add('fx-' + p.titleEffect);
  }
  if (p.accentColor) document.documentElement.style.setProperty('--accent', p.accentColor);
  const sub = document.getElementById('subtitle');
  if (p.subtitle) {
    sub.textContent = p.subtitle;
    sub.style.display = '';
    sub.style.color = p.subtitleColor || 'rgba(255,255,255,0.85)';
  } else {
    sub.style.display = 'none';
  }
  // Auto-fit: title gets all the leftover vertical space between sprite and
  // (optional) subtitle. Width is the canvas minus padding.
  const titleBox = document.getElementById('titleBox');
  window.fitText(title, titleBox, { min: 36, max: 220 });
};
</script>
</body>
</html>
