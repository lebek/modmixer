<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Icon-left preview</title>
<link rel="stylesheet" href="_shared.css" />
<style>
  .canvas {
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
  .bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
  }
  /* Scrim added on top of a user-supplied background image so the title and
     sprite stay legible over busy screenshots. Heavier on the right (where
     the title sits) and lighter on the left (where the sprite sits). */
  .bg-scrim {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 1;
    background: linear-gradient(
      to right,
      rgba(0,0,0,0.5) 0%,
      rgba(0,0,0,0.55) 40%,
      rgba(0,0,0,0.82) 100%
    );
  }
  .bg-scrim.active { display: block; }
  .row {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: row;
    width: 100%;
    height: 100%;
    padding: 56px 64px;
    gap: 56px;
    align-items: center;
  }
  .sprite-wrap {
    flex: 0 0 480px;
    height: 480px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sprite-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 18px 30px rgba(0,0,0,0.45));
  }
  .right {
    flex: 1 1 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 22px;
  }
  .title-box {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
  }
  .title {
    width: 100%;
    text-align: left;
  }
  .subtitle {
    flex: 0 0 auto;
    color: rgba(255,255,255,0.85);
    font-size: 28px;
  }
</style>
</head>
<body>
<div class="canvas" id="canvas">
  <div class="bg" id="bg"></div>
  <div class="bg-scrim" id="bgScrim"></div>
  <div class="row">
    <div class="sprite-wrap"><img id="sprite" alt="" /></div>
    <div class="right">
      <div class="subtitle" id="subtitle" style="display:none"></div>
      <div class="title-box" id="titleBox"><div class="title" id="title"></div></div>
    </div>
  </div>
</div>
<script src="_shared.js"></script>
<script>
window.__renderPreview = function (p) {
  const bg = document.getElementById('bg');
  const bgScrim = document.getElementById('bgScrim');
  if (p.backgroundImageUrl) {
    bg.style.background = '#000';
    bg.style.backgroundImage = `url("${p.backgroundImageUrl}")`;
    bgScrim.classList.add('active');
  } else {
    bg.style.background = p.background || 'linear-gradient(135deg,#222 0%,#0d0d10 100%)';
    bgScrim.classList.remove('active');
  }
  const sprite = document.getElementById('sprite');
  if (p.spriteUrl) {
    sprite.src = p.spriteUrl;
    sprite.style.display = '';
  } else {
    sprite.style.display = 'none';
  }
  const title = document.getElementById('title');
  title.textContent = p.title || '';
  title.style.color = p.titleColor || '#fff';
  title.classList.toggle('font-rimworld', p.titleFont === 'rimworld');
  title.classList.remove('fx-shadow', 'fx-outline', 'fx-glow');
  if (p.titleEffect && p.titleEffect !== 'none') {
    title.classList.add('fx-' + p.titleEffect);
  }
  if (p.accentColor) document.documentElement.style.setProperty('--accent', p.accentColor);
  const sub = document.getElementById('subtitle');
  if (p.subtitle) {
    sub.textContent = p.subtitle;
    sub.style.display = '';
    sub.style.color = p.subtitleColor || 'rgba(255,255,255,0.85)';
  } else {
    sub.style.display = 'none';
  }
  const titleBox = document.getElementById('titleBox');
  window.fitText(title, titleBox, { min: 40, max: 200 });
};
</script>
</body>
</html>
