# ModMixer NeoForge bridge — pinned toolchain.
#
# These coordinates mirror src/agent/minecraft/versions.ts in the ModMixer app.
# Bumping the target game version is a deliberate, tested change in BOTH places,
# never a runtime variable.

org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=false
org.gradle.parallel=true

# --- Minecraft / NeoForge ---------------------------------------------------
# NeoForge drops the leading "1." of the MC version: 1.21.1 -> 21.1.z.
minecraft_version=1.21.1
neo_version=21.1.234

# --- Parchment (param-name / javadoc mappings for the dev workspace) ---------
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# --- This mod ----------------------------------------------------------------
mod_id=modmixerbridge
mod_name=ModMixer Bridge
mod_version=0.1.0
mod_group_id=com.modmixer.bridge
mod_authors=ModMixer
mod_license=MIT

# Java major version Mojang ships for 1.21.x.
java_version=21
